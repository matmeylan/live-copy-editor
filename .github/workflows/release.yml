name: Release

# PRs: run checks and build the package.
# Push to main: also publish a GitHub Release and ship to the Chrome Web Store.
on:
  pull_request:
  push:
    branches: [main]
    # Docs-only changes don't ship a new version (each version is a store review).
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

# Never run two publishes at once; the Web Store rejects overlapping submissions.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checks
        run: scripts/check.sh

      # The Web Store refuses a version it has already seen, so every build gets a
      # fresh one: MAJOR.MINOR from manifest.json, PATCH = this workflow's run number.
      # Bump MAJOR or MINOR in manifest.json by hand when you want to.
      - name: Compute version
        id: version
        run: |
          base=$(node -p 'require("./manifest.json").version.split(".").slice(0,2).join(".")')
          echo "version=${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: scripts/build.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: live-copy-editor-${{ steps.version.outputs.version }}
          path: dist/live-copy-editor.zip

  release:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub Release
      id-token: write  # prove to Google that this run comes from this repo's main branch
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: live-copy-editor-${{ needs.build.outputs.version }}

      # A stable download link for manual installs:
      # https://github.com/<owner>/<repo>/releases/latest/download/live-copy-editor.zip
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" live-copy-editor.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${VERSION}" \
            --generate-notes

      # Chrome Web Store publishing uses Workload Identity Federation: no stored secret.
      # One-time setup: scripts/setup-google-cloud.sh, then four repository variables.
      - name: Check Web Store setup
        id: cws
        env:
          CWS_WIF_PROVIDER: ${{ vars.CWS_WIF_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: |
          missing=()
          for v in CWS_WIF_PROVIDER CWS_SERVICE_ACCOUNT CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            [[ -z "${!v}" ]] && missing+=("$v")
          done
          if (( ${#missing[@]} )); then
            echo "::notice::Skipping Chrome Web Store publish. Missing repository variables: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Google login (30-minute token)
        id: auth
        if: steps.cws.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and submit to Chrome Web Store
        if: steps.cws.outputs.ready == 'true'
        uses: hamzahamidi/publish-to-chrome-web-store@c8919147f8de0d6f1129bec36345e4a9aa638af9 # v1.2.2
        with:
          access-token: ${{ steps.auth.outputs.access_token }}
          publisher-id: ${{ vars.CWS_PUBLISHER_ID }}
          item-id: ${{ vars.CWS_EXTENSION_ID }}
          zip: live-copy-editor.zip
